<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABUUR Platform Architecture Blueprint</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #0f172a;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }
    .toolbar {
      width: 100%;
      max-width: 1680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: #334155;
      border-color: #64748b;
    }
    .btn-primary {
      background: #0284c7;
      border-color: #0369a1;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .canvas-container {
      width: 100%;
      max-width: 1680px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
    }
    img.diagram {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="title-group">
      <span class="badge">Architecture Blueprint</span>
      <h1>ABUUR Full Platform Architecture (Corrected Alignment)</h1>
    </div>
    <div class="actions">
      <button class="btn" onclick="window.print()">🖨️ Print / Save PDF</button>
      <a class="btn btn-primary" href="platform-architecture.svg" download="abuur-platform-architecture.svg">⬇️ Download SVG Vector</a>
    </div>
  </div>

  <div class="canvas-container">
    <img class="diagram" src="platform-architecture.svg?v=2" alt="ABUUR Full Platform Architecture">
  </div>
</body>
</html>
