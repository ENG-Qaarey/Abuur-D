# Render Blueprint: hosts the ABUUR backend API (Express + Prisma on Supabase Postgres).
# The website on Cloudflare calls it through ABUUR_API_URL.
# Secrets are marked sync: false, so Render asks for them when you create the Blueprint.
services:
  - type: web
    name: abuur-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api
      - key: PORT
        value: "10000"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://abuur-d.muscabaxmed762.workers.dev
      - key: SITE_URL
        value: https://abuur-d.muscabaxmed762.workers.dev
      - key: PUBLIC_API_URL
        value: https://abuur-api.onrender.com/api
      - key: SUPABASE_URL
        value: https://xlwmxjrymlugpdzmcmew.supabase.co
      - key: SUPABASE_JWKS_URL
        value: https://xlwmxjrymlugpdzmcmew.supabase.co/auth/v1/.well-known/jwks.json
      - key: STORAGE_DRIVER
        value: supabase
      - key: STORAGE_BUCKET
        value: abuur-private
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: WORKER_DISABLED
        value: "false"
      # Secrets: paste these in Render when it asks (same values as your local backend .env)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CREDENTIALS_KEY
        sync: false
